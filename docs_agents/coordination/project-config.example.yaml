# Feature coordinator — documented example configuration for mx-admin-cloud (v5 §10).
#
# This file is DOCUMENTATION, not a live credential file. It loads into exactly the same
# object as the coordinator's built-in configuration (feature_coordinator/config.py,
# default_config()); `python -m feature_coordinator config` and the test suite verify that.
#
# Never put endpoints, API keys or other secrets here. Provider endpoints and keys are read
# from the runtime environment only (variable NAMES below). Paths are repository-relative
# POSIX patterns: owned/excluded paths are either "<dir>/**" (a subtree) or an exact file;
# protected/approval lists may also use "*" inside one segment and a leading "**/" (any depth).

schema_version: 1
repository: mx-admin-cloud

# Fixed v5 ceilings — validated, not configurable:
execution_host: single-linux            # all agent processes, Git and tools on one Linux host
checkout_mode: shared-single-feature    # one shared checkout, one active feature at a time

feature:
  branch_pattern: "feature/{slug}"      # exactly one branch per feature
  base_branch: dev                      # D-4 approved 2026-10-17: feature/* branches start from dev
  pr_policy: one-after-all-gates        # exactly one final PR per feature, after every gate passes

git:
  single_mutation_coordinator: true     # only the Git coordinator mutates .git
  serialize_commits_push_branch_and_pr: true
  no_agent_branch_switches: true        # branch operations need every writer quiescent
  no_per_agent_worktrees: true          # one shared checkout; no worktree per agent

state:
  # Resolved as $XDG_STATE_HOME/<app_dir>, else ~/.local/state/<app_dir> (D-12). Outside Git.
  app_dir: mx-admin-agents
  # Deny-by-default allowlist; FUSE and network filesystems are always rejected.
  allowed_filesystems: [ext4, ext3, ext2, xfs, btrfs, f2fs, tmpfs]

# Role → agent → model (W2). `provider` is the agent; `model` overrides that provider's model
# ("default" = the CLI's own default model; omitted = the provider's `model`). Both are plain
# configuration: changing them needs no code change. An agent/model combination the agent kind
# does not support (e.g. a Claude model for Codex) is rejected, never substituted. Write scopes
# belong to the role and do not change with the agent.
roles:                                   # max_writers is fixed to 1 per role (v5 ceiling)
  backend:
    provider: claude                     # Claude Code
    model: opus
    owned_paths: ["backend/**", "docs_agents/backend/**"]
    excluded_paths: ["backend/data/**"]
    max_writers: 1
  cli:
    provider: claude                     # Claude Code; `provider: codex` (+ a Codex model or default) also works
    model: sonnet
    owned_paths: ["cli/**", "docs_agents/cli/**"]
    max_writers: 1
  frontend:
    provider: codex
    model: default                       # Codex's own default model, explicitly
    owned_paths: ["frontend/**", "docs_agents/frontend/**"]
    max_writers: 1
  automation:
    provider: remote_qwen
    enabled: false                       # disabled: its tasks are never run (no request to the remote Qwen)
    owned_paths: ["scripts/**", "test_environment/**", "docs_agents/automation/**"]
    # testenv.toml is inside test_environment/** but approval-required; owned paths need no grant, so exclude it
    excluded_paths: ["test_environment/mxfix/**", "test_environment/mxissues/**", "test_environment/testenv.toml",
                     "test_environment/testenv.local.toml", "scripts/deploy.sh"]
    max_writers: 1
  coordination:
    provider: claude                     # configurable
    model: sonnet
    owned_paths: ["docs_agents/coordination/**"]
    max_writers: 1

# Never writable by any role, and no task grant can change that.
protected_paths:
  - ".git/**"
  - ".env"
  - ".env.*"
  - "**/.env"                            # env files at any depth (dev/debug defaults stay unchanged, D-5)
  - "**/.env.*"
  - "content/**"
  - "data/**"
  - "backend/data/**"
  - "test_environment/mxfix/**"          # independent bug-finding/repair system
  - "test_environment/mxissues/**"       # independent bug-finding/repair system
  - "test_environment/testenv.local.toml"  # per-developer test-env overrides (Git-ignored)

# Writable only with an explicit, task-specific operator grant (v5 §3).
approval_required_paths:
  - "CLAUDE.md"
  - "AGENTS.md"
  - "README.md"
  - ".gitignore"
  - ".gitlab-ci.yml"
  - "test_environment/testenv.toml"
  - "scripts/deploy.sh"
  - ".claude/**"
  - ".cursor/**"
  - ".opencode/**"
  - ".aiassistant/**"
  - ".agents/**"
  - ".github/**"
  - "docker/**"
  - "docs_agents/architecture/**"
  - "docs_agents/README.md"

providers:
  claude:
    kind: claude-code
    executable: claude
    model: ""                            # the provider default ("" or "default": Claude Code's own default)
    # No credential files (W1, D-20): nothing is mounted into a sandbox to authenticate. A legacy
    # `credential_files` key is accepted but has no effect (reported by worker-check).
  codex:
    kind: codex
    executable: codex
    model: ""
  remote_qwen:
    # Exact operator profile (v5 §10.1.1). Configuration input, NOT verified behavior.
    kind: openai-compatible
    default_model: Qwen3.6-35B-A3B-Q4_K_M.gguf   # exact ID; overridable at runtime via model_env
    display_name: Qwen 3.6 35B A3B
    base_url_env: AGENT_QWEN_BASE_URL     # ends in /v1; the client appends /chat/completions once
    model_env: AGENT_QWEN_MODEL
    api_key_env: AGENT_QWEN_API_KEY       # optional; private secret store only (D-18)
    api_route: chat.completions
    declared_capabilities:                # claims only — every one is disabled until validated (V5-5)
      tool_calling: true
      vision: true
      streaming: true
      thinking: true
    validated_capabilities: []            # filled only after a validation run
    context_window_tokens: 131072
    declared_max_input_tokens: 128000     # metadata; NOT usable together with the full output reservation
    max_output_tokens: 16384
    safety_margin_tokens: 4096
    effective_max_input_tokens: 110592    # 131072 - 16384 - 4096 (hard maximum 114688)
    temperature: 0.2
    client_edit_tools: [apply-patch, multi-find-replace, find-replace]   # executed LOCALLY, Automation paths only
    connect_timeout_seconds: 10
    request_timeout_seconds: 180
    max_retries: 2
    require_tool_use_validation: true
    require_tls: true                     # plain-HTTP non-loopback endpoints blocked ...
    plain_http_exception: false           # ... unless the operator records an exception (D-15)
    code_disclosure_allowed: false        # sending repository code needs an approved policy (D-16)

# Gate commands (argv). backend-*, cli-* and frontend-* gates run in that directory, others at the root.
# Every gate runs in a bubblewrap sandbox: the checkout READ-ONLY, no network, private /tmp and HOME.
gates:
  backend-tests: [python, -m, pytest, -q, -p, "no:cacheprovider"]
  contract-check: [python, scripts/export_openapi.py, --docs-agents, --check]
  docs-check: [python, scripts/check_docs_agents.py]
  frontend-type-check: [npm, run, type-check]
  frontend-build: [npm, run, build, --, --outDir, /tmp/fc-frontend-dist, --emptyOutDir]   # output to private /tmp
  frontend-tests: [npm, run, "test:voices"]
  frontend-tests-content: [npm, run, "test:content"]
  frontend-tests-auth: [npm, run, "test:auth"]
  coordinator-tests: [python, -m, pytest, -q, -p, "no:cacheprovider", scripts/tests, feature_coordinator/tests]

# Baseline-aware Pylint gates (D-19): findings already present at the feature's base commit
# are reported; findings the feature introduces block. The only policy is block-new.
lint_gates:
  backend-lint:
    root: backend
    targets: [src]
    pythonpath: [src]
    policy: block-new
  cli-lint:
    root: cli
    targets: [src/kiddo_cli]
    pythonpath: [src]
    policy: block-new

# Gates that must not run against a real checkout until the named fix lands (reported as "blocked").
unsafe_gates: {}

# How real runners and gates execute (Phase 3).
runtime:
  containment: bwrap                     # fixed: gates and the bwrap backend are never unconfined
  # W2: native-cli = the installed claude/codex CLIs with the operator's existing SUBSCRIPTION logins,
  # run directly in the workspace (NOT a security sandbox); bwrap = the Phase 3 OS containment.
  # Never a silent fallback from one to the other.
  execution_backend: native-cli
  python_interpreter: auto               # auto: <workspace>/.venv/bin/python, else python3; or an absolute path
  agent_network: false                   # no effect since W1 (D-21): bwrap runners never share the host network
  gate_network: false                    # fixed
  task_timeout_seconds: 3600
  heartbeat_interval_seconds: 10
  stale_heartbeat_seconds: 120           # an alive worker without heartbeats is reported "unresponsive"
  terminate_grace_seconds: 10            # SIGTERM, then SIGKILL of the whole sandbox
  gate_timeout_seconds: 900
  claude_max_budget_usd: 5.0             # passed as --max-budget-usd
  secret_patterns: ["**/.env", "**/.env.*"]    # untracked/ignored matches are hidden from agents
  secret_exempt_suffixes: [.example, .sample, .template]
  role_commands:                         # Claude Code Bash allowlist per role (prefix rules); all else denied
    # {python} = the resolved interpreter (W2); a bare python/python3 is rejected (it may not exist)
    backend: ["{python} -m pytest:*", "{python} -m pylint:*", "{python} -m compileall:*"]
    cli: ["{python} -m pytest:*", "{python} -m pylint:*", "kiddo-cli --help:*"]
    coordination: ["{python} scripts/check_docs_agents.py:*"]
  # W1 decision A: opt-in hardening of the native-cli backend (feature_coordinator/native_hardening.py,
  # w1-progress.md). It confines the AGENT TOOLS, not the CLI processes, and fails closed (the runner is
  # unavailable) when this host or CLI version cannot enforce it. Off: native-cli behaves exactly as above.
  native_hardening:
    enabled: false
    claude_shell: disabled               # disabled: no Bash tool | sandboxed: Claude Code's Bash sandbox
                                         # (UNVERIFIED; needs nested user namespaces, denied on Ubuntu 24.04)
    codex_home: ""                       # optional Worker-dedicated CODEX_HOME (own ChatGPT login, mode 0700)
    read_paths: []                       # extra read-only paths for Codex commands, e.g. the node toolchain

# The autonomous Worker service (W4; docs_agents/coordination/worker-autonomy.md). Safe defaults:
# the service is OFF until autonomous.enabled is set; ONE agent at a time; bounded, category-specific
# retries that survive restarts; validation auto-fix OFF; a conflict always stops the affected task.
# An exhausted subscription is waited for: never another provider, model or billing method.
worker:
  autonomous:
    enabled: false                       # `python -m feature_coordinator worker start` refuses to run until this is true
  max_parallel: 1                        # agents at a time (the service: fixed 1 in W4; `python -m feature_coordinator work` default)
  idle_poll_seconds: 30                  # an idle or waiting service looks again this often
  heartbeat_seconds: 30                  # health record refresh
  max_launches_per_task: 10              # hard cap on agent launches per task, whatever the reason
  retry:
    enabled: true
    transient:                           # network errors, a CLI briefly missing, a deferred commit
      max_attempts: 3
      initial_delay_seconds: 60          # backoff: 60, 120, 240 … capped at max_delay_seconds
      max_delay_seconds: 1800
    subscription:                        # usage limit reached: WAITING, conservative bounded rechecks
      enabled: true
      recheck_interval_seconds: 900
      max_rechecks: 16
    validation:                          # failing gates: operator attention unless auto-fix is enabled
      auto_fix_enabled: false
      max_attempts: 2
  recovery:
    auto_recover_safe: true              # W3 safe recovery when the service starts
    stop_on_conflict: true               # fixed: conflicts are never resolved automatically
    stop_orphans_after_deadline: true    # an identified orphaned agent is stopped only after its run deadline
  startup:
    failure_limit: 3                     # identical consecutive startup failures → exit 78 (systemd: no restart)

# Host-side authentication broker (W1: D-20, D-21; docs_agents/coordination/worker-security.md).
# Every real runner sandbox has its own empty network namespace; its CLI reaches the model only
# through this broker, which holds the upstream credential on the host and forwards approved
# provider operations to the provider's fixed HTTPS endpoint. No secrets here — at most the
# absolute HOST paths of API key files (mode 0600, outside every checkout).
broker:
  credential_source: none                # none: real runners are UNAVAILABLE (fail closed). api-key-file:
                                         # a per-token-billed provider API key — an operator decision (D-20);
                                         # a Claude/ChatGPT subscription login cannot be brokered
  api_key_files: {}                      # provider name -> absolute host path (api-key-file only)
  max_request_bytes: 33554432            # 32 MiB per request
  max_response_bytes: 67108864           # 64 MiB per response; a longer stream is cut off (the run fails)
  upstream_idle_timeout_seconds: 300.0   # connect / read idle timeout towards the provider
  max_request_seconds: 1800.0            # total time of one request
  max_requests_per_run: 1000             # then 429: the run's request budget is spent
  max_concurrent_requests: 8
  handshake_timeout_seconds: 30.0        # the sandbox must hand over its broker endpoint within this time

# GitHub Issues adapter (Phase 4). No credentials here: the adapter calls the installed
# GitHub CLI (`gh api`), which uses its existing login. Issues and labels are the human-
# visible record only; the local state stays authoritative for claims, locks and permissions.
github:
  repository: spyderbg/mx-admin-cloud
  coordinator_id: mx-admin-cloud.feature-coordinator   # written into every owned Issue's marker
  transport: gh-cli                      # fixed: the authenticated GitHub CLI
  gh_executable: gh
  hostname: github.com
  write_scope: test-features-only        # Phase 4 ceiling; "all-features" needs operator approval (Phase 5)
  test_title_prefix: "[Feature Coordinator Test] "
  command_authors: [spyderbg]            # only these logins may issue /feature commands in comments
  command_min_permission: write          # ... and only with at least this repository permission
  request_timeout_seconds: 30
  max_retries: 3                         # bounded; exponential backoff
  backoff_base_seconds: 1.0
  max_backoff_seconds: 30.0
  max_rate_limit_wait_seconds: 120.0     # a longer rate-limit wait defers the sync instead
  min_write_interval_seconds: 1.0        # pacing between write requests (secondary rate limits)
  sync_lock_timeout_seconds: 120.0       # github-sync.lock only; never a coordinator, role or Git lock
  create_settle_seconds: 5.0             # re-search window after an interrupted Issue creation
  max_pages: 20                          # 100 items per page; more pages is an error, never a silent cut
  # GitHub Projects (v2) board (Phase 4 extension; docs_agents/coordination/github-projects.md).
  # A projection only: the board never claims, locks, starts or approves anything, and a card
  # moved by a person is restored on the next sync. Needs the gh login's `project` scope.
  project:
    enabled: true
    owner: spyderbg
    owner_type: user                     # user | organization
    number: 2                            # "mx-admin-cloud automation"
    node_id: PVT_kwHOACEIPc4BndH-        # the project's GraphQL ID: owner, number AND node ID must match
    title: mx-admin-cloud automation     # informational; a different title is only reported
    protected_numbers: [1]               # "mx-admin-cloud issues" (mxissues bug workflow): never written
    status_field: Status
    status_names:                        # board columns, in order (the keys have fixed meanings)
      backlog: Backlog
      ready: Ready
      in_progress: In Progress
      blocked: Blocked
      review: Review
      done: Done
    status_reuse: {Todo: backlog}        # GitHub's default "Todo" option becomes Backlog (option ID kept)
    agent_field: Agent
    agent_names:
      coordination: Coordination
      backend: Backend
      cli: CLI
      frontend: Frontend
      automation: Automation
      full-project: Full Project
    feature_id_field: Feature ID
    blocked_reason_field: Blocked Reason
    board_view: Kanban                   # a board grouped by Status (GitHub's default "View N" board is reused)
    active_view: Active Tasks            # open Issues in Ready, In Progress, Blocked, Review (D-29)
    item_settle_seconds: 2.0             # after adding an item, before setting fields (project workflows)
    max_field_attempts: 2                # field writes re-applied when a read-back differs
  # W4.3.1 GitHub Issue intake (docs_agents/coordination/github-intake.md). An Issue that a command
  # author approves with `/worker approve <role> <spec-sha256>` (printed by `python -m feature_coordinator github intake
  # show N`) becomes ONE feature with ONE task of that role; the approved title and body are recorded
  # and never re-read. Nothing is written to an Issue before approval. Off until an operator enables it.
  intake:
    enabled: false
    poll_interval_seconds: 60            # the Worker service polls GitHub at most this often (>= 10)
    max_issues_per_poll: 30              # changed Issues whose comments are read per poll; the rest next time
    max_spec_characters: 20000           # a longer Issue body is refused as a task specification
    role_gates:                          # what an approved task of each role must pass (no gates: no approval)
      backend: [backend-tests, backend-lint, docs-check]
      cli: [cli-lint, docs-check]
      frontend: [frontend-type-check, frontend-build, docs-check]
      coordination: [docs-check]
  # W4.3.3 automatic publication (docs_agents/coordination/github-intake.md §10). For a feature made from
  # an approved Issue only: once every task is verified, the integration barrier runs, the feature's own
  # branch is pushed (never dev or another protected branch, never forced), ONE Draft PR to its base branch
  # is opened (or an existing matching PR adopted), and after a PERSON merged it the feature is done, the
  # Issue closed and its Project #2 card moved to Done. The Worker never merges. Off until an operator enables it.
  publish:
    enabled: false
    poll_interval_seconds: 60            # the Worker service checks the PR at most this often (>= 10)
    git_timeout_seconds: 120             # one push, ls-remote or fetch (10..1800); a timeout is retried safely
  # W4.5 label-driven planning and approval (docs_agents/coordination/github-intake.md §12). `worker:plan` on an
  # Issue → the Desktop Worker's Claude Code (subscription login, NO tools, outside the checkout) proposes a
  # plan; it is validated deterministically (roles, owned/protected paths, dependencies, required gates) and
  # published on the Issue as version N. `worker:approve` → the GitHub Action (.github/workflows/
  # worker-issue-labels.yml, on the default branch) posts a receipt; the coordinator re-verifies it all and only
  # then plans the feature with the plan's tasks. Needs github.intake.enabled. Off until an operator enables it.
  planning:
    enabled: false
    provider: claude                     # a Claude Code provider (its subscription login; never an API key)
    model: opus                          # validated like a role model; "default" = the CLI's own default
    timeout_seconds: 900                 # one planner invocation (60..3600)
    max_attempts: 2                      # planner invocations per request (1..3); a refused plan is fed back once
    max_tasks: 4                         # at most one task per role
    max_instructions_characters: 6000
    receipt_author: github-actions[bot]  # the only author whose receipts are read (evidence only; a bot login)
    receipt_workflow: .github/workflows/worker-issue-labels.yml  # the Actions run behind a receipt must be this
    receipt_wait_seconds: 900            # a `worker:approve` label without a receipt for this long is refused
    conventions_files: [AGENTS.md, CLAUDE.md]  # read by the coordinator into the planning prompt
    max_conventions_characters: 6000
  # W4.6.1 (R1) independent AI review of a published Draft PR (docs_agents/coordination/github-intake.md §13).
  # An OPERATOR runs `python -m feature_coordinator github review run FEATURE --apply`: the Desktop Worker's
  # Claude Code (subscription login, NO tools, outside the checkout) reviews the PR's diff at its verified head
  # against the approved Issue and plan; the coordinator validates the answer, records the outcome (PASS,
  # PASS_WITH_NOTES, REQUEST_CHANGES or ERROR) and posts one comment on the PR. Advisory only: nothing merges.
  # The Worker service never starts a review in R1. Needs github.intake and github.publish. Off by default.
  review:
    enabled: false
    provider: claude                     # a Claude Code provider (R1: no Codex reviewer, no fallback provider)
    model: opus                          # validated like a role model; "default" = the CLI's own default
    independence: prefer                 # prefer | require (require: ERROR when reviewer = an implementer's model)
    timeout_seconds: 600                 # one reviewer invocation (60..1800)
    max_attempts: 1                      # reviewer invocations per review (1..3)
    unavailable_wait_seconds: 3600       # a reviewer unavailable this long makes the review ERROR (60..86400)
    max_diff_characters: 150000          # a larger diff is not reviewed (ERROR), never truncated
    max_findings: 30                     # more findings is invalid reviewer output (1..100)
