[project]
name = "kiddo-cli"
version = "0.1.1"
description = "CLI client for Kiddo content management backend (API-only)"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "requests",
    "httpx",
    "rich",
]

[project.scripts]
kiddo-cli = "kiddo_cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 10
