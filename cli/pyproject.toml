[project]
name = "kiddo-cli"
version = "0.1.1"
description = "CLI client for Kiddo content management backend (API-only)"
requires-python = ">=3.10"
dependencies = [
    # Typer 0.23+ requires click>=8.2.1 on Python 3.10+, which conflicts with gtts (click<8.2).
    "typer>=0.22.0,<0.23",
    "click>=8.0.0,<8.2",
    "requests",
    "httpx",
    "rich",
]

[project.scripts]
kiddo-cli = "kiddo_cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Lets `pytest` run from cli/ without installing the package or setting PYTHONPATH.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 10
