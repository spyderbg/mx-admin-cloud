# GitLab CI/CD for mx-admin — runs only on main branch
# Runner uses shell executor on the same Ubuntu 24.04 host

stages:
  - deploy

deploy:
  stage: deploy
  tags:
    - shell
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - echo "before custom export START_BACKEND_CLI: $START_BACKEND_CLI"
    - export START_BACKEND_CLI="true"
  script:
    - bash scripts/deploy.sh build
    - bash scripts/deploy.sh start-core
    - bash scripts/deploy.sh start-cli
    - bash scripts/deploy.sh validate
    - bash scripts/deploy.sh install-cli
