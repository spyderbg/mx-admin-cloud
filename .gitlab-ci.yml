# GitLab CI/CD for mx-admin — runs only on main branch

default:
  image: docker:24

stages:
  - deploy

deploy:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    COMPOSE_FILE: "docker/docker-compose.yml"
  before_script:
    - apk add --no-cache curl docker-compose bash py3-pip
    - ln -sf "$(which pip3)" /usr/local/bin/pip 2>/dev/null || true
  script:
    - bash scripts/deploy.sh
  after_script:
    - "true"
