name: Validate improvements integration
on:
  push:
    branches: [ci/improvements-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        env:
          PYTHONPATH: src
        run: python -m pytest -q
      - name: Backend compile and pylint
        run: |
          python -m compileall -q backend/src
          python -m pylint backend/src --fail-under=10
      - name: Validation scripts tests
        env:
          PYTHONPATH: scripts
        run: python -m pytest -q scripts/tests

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r cli/requirements.txt pytest pylint
      - name: CLI tests
        working-directory: cli
        run: python -m pytest -q
      - name: CLI lint
        run: python -m pylint cli/src --fail-under=10

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
