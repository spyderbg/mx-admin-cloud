name: Mirror to GitLab

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror repository to GitLab
        env:
          GH_TOKEN: ${{ github.token }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          GITLAB_REPOSITORY: http://82.103.77.45/marxman/mx-admin.git
        run: |
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repo.git

          cd repo.git

          git push --prune \
            "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPOSITORY}" \
            "+refs/heads/*:refs/heads/*"

          git push --prune \
            "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPOSITORY}" \
            "+refs/tags/*:refs/tags/*"
