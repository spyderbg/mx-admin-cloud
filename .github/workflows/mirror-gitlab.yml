name: Mirror to GitLab

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror repository to GitLab
        env:
          GH_TOKEN: ${{ github.token }}

          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          GITLAB_HOST: ${{ vars.GITLAB_HOST }}
          GITLAB_PROJECT_PATH: ${{ vars.GITLAB_PROJECT_PATH }}

        run: |
          git clone --mirror \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            repo.git

          cd repo.git

          git push --prune \
            "http://oauth2:${GITLAB_TOKEN}@${GITLAB_HOST}/${GITLAB_PROJECT_PATH}" \
            "+refs/heads/*:refs/heads/*"

          git push --prune \
            "http://oauth2:${GITLAB_TOKEN}@${GITLAB_HOST}/${GITLAB_PROJECT_PATH}" \
            "+refs/tags/*:refs/tags/*"