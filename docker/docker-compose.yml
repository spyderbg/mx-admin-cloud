services:
  backend:
    container_name: kiddo-backend
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    ports:
      - "9000:8000"
    volumes:
      - ../content:/app/content
      - ../archive:/app/archive
      - backend-data:/app/data
    environment:
      - CONTENT_DIR=/app/content
      - ARCHIVE_DIR=/app/archive
      - DB_PATH=/app/data/users.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
  frontend:
    container_name: kiddo-frontend
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "9001:80"
    depends_on:
      - backend

  backend-cli:
    container_name: kiddo-backend-cli
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    volumes:
      - ../content:/app/content
      - ../archive:/app/archive
      - backend-data:/app/data
      - /tmp:/tmp
    environment:
      - CONTENT_DIR=/app/content
      - ARCHIVE_DIR=/app/archive
      - DB_PATH=/app/data/users.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    command: ["uvicorn", "src.main:app", "--uds", "/tmp/kiddo-backend.sock"]
    profiles:
      - cli

volumes:
  backend-data:
