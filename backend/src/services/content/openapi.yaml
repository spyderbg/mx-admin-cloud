openapi: 3.1.0
info:
  title: Content Management API
  version: 0.1.0
servers: []
components:
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /api/v1/login
  schemas:
    ArchivedEntry:
      properties:
        base_name:
          type: string
          title: Base Name
        archive_folder:
          type: string
          title: Archive Folder
        archived_at:
          type: integer
          title: Archived At
      type: object
      required:
      - base_name
      - archive_folder
      - archived_at
      title: ArchivedEntry
      description: Single archived category entry.
    Body_create_item_endpoint_api_v1_content_items_post:
      properties:
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
        category:
          type: string
          title: Category
        item:
          type: string
          title: Item
      type: object
      required:
      - image
      - category
      - item
      title: Body_create_item_endpoint_api_v1_content_items_post
    CategoryDetailResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          additionalProperties:
            type: string
          type: object
          title: Name
        items:
          items:
            $ref: '#/components/schemas/ItemSummary'
          type: array
          title: Items
          default: []
      type: object
      required:
      - id
      - name
      title: CategoryDetailResponse
      description: Response for GET /content/categories/{name}.
    CategoryImagesResponse:
      properties:
        category:
          type: string
          title: Category
        items:
          items:
            $ref: '#/components/schemas/ItemDetailResponse'
          type: array
          title: Items
          default: []
      type: object
      required:
      - category
      title: CategoryImagesResponse
      description: Response for GET /categories/{name}/images.
    CategoryListResponse:
      properties:
        categories:
          items:
            $ref: '#/components/schemas/CategorySummary'
          type: array
          title: Categories
        archived:
          anyOf:
          - items:
              $ref: '#/components/schemas/ArchivedEntry'
            type: array
          - type: 'null'
          title: Archived
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - categories
      title: CategoryListResponse
      description: Response for GET /content/categories.
    CategorySummary:
      properties:
        category_id:
          type: string
          title: Category Id
        name:
          additionalProperties:
            type: string
          type: object
          title: Name
        items_count:
          type: integer
          title: Items Count
      type: object
      required:
      - category_id
      - name
      - items_count
      title: CategorySummary
      description: Summary of a single category returned in the list endpoint.
    CategoryVoicesResponse:
      properties:
        category:
          type: string
          title: Category
        voices:
          items:
            $ref: '#/components/schemas/VoiceResponse'
          type: array
          title: Voices
          default: []
      type: object
      required:
      - category
      title: CategoryVoicesResponse
      description: Response for GET /categories/{name}/voices.
    CreateCategoryBody:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: CreateCategoryBody
      description: Request body for creating a new category.
    CreateCategoryResponse:
      properties:
        category:
          type: string
          title: Category
        message:
          type: string
          title: Message
      type: object
      required:
      - category
      - message
      title: CreateCategoryResponse
      description: Response for POST /content/categories.
    CreateItemResponse:
      properties:
        category:
          type: string
          title: Category
        item:
          type: string
          title: Item
        folder:
          type: string
          title: Folder
        image_id:
          type: string
          title: Image Id
      type: object
      required:
      - category
      - item
      - folder
      - image_id
      title: CreateItemResponse
      description: Response for POST /content/items.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ItemDetailResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        files:
          items:
            type: string
          type: array
          title: Files
          default: []
        thumbnail_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail Uri
        voices:
          items:
            $ref: '#/components/schemas/VoiceResponse'
          type: array
          title: Voices
          default: []
      type: object
      required:
      - id
      - name
      title: ItemDetailResponse
      description: Detailed response for a single item.
    ItemImagesResponse:
      properties:
        item_id:
          type: string
          title: Item Id
        files:
          items:
            type: string
          type: array
          title: Files
          default: []
        thumbnail_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail Uri
      type: object
      required:
      - item_id
      title: ItemImagesResponse
      description: Response for GET /categories/{name}/items/{item_id}/images.
    ItemListResponse:
      properties:
        items:
          items:
            type: string
          type: array
          title: Items
      type: object
      required:
      - items
      title: ItemListResponse
      description: Response for GET /categories/{category_name}/items.
    ItemSummary:
      properties:
        item_id:
          type: string
          title: Item Id
        name:
          additionalProperties:
            type: string
          type: object
          title: Name
      type: object
      required:
      - item_id
      - name
      title: ItemSummary
      description: Item entry returned inside CategoryDetailResponse.
    ItemVoicesResponse:
      properties:
        item_id:
          type: string
          title: Item Id
        voices:
          items:
            $ref: '#/components/schemas/VoiceResponse'
          type: array
          title: Voices
          default: []
      type: object
      required:
      - item_id
      title: ItemVoicesResponse
      description: Response for GET /categories/{name}/items/{item_id}/voices.
    RemoveCategoryResponse:
      properties:
        archived:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Archived
        removed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Removed
        name:
          type: string
          title: Name
        archive_folder:
          anyOf:
          - type: string
          - type: 'null'
          title: Archive Folder
        destination:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination
        message:
          type: string
          title: Message
      type: object
      required:
      - name
      - message
      title: RemoveCategoryResponse
      description: 'Response for DELETE /content/categories/{name}.


        Maybe an archive result or a permanent delete result, so both

        "archived" and "removed" are optional.'
    RenameCategoryBody:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: RenameCategoryBody
      description: Request body for renaming a category.
    RenameCategoryResponse:
      properties:
        category:
          type: string
          title: Category
        message:
          type: string
          title: Message
      type: object
      required:
      - category
      - message
      title: RenameCategoryResponse
      description: Response for PATCH /content/categories/{name}.
    RestoreCategoryBody:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: RestoreCategoryBody
      description: Request body for restoring a category.
    RestoreCategoryResponse:
      properties:
        restored:
          type: boolean
          title: Restored
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        from_archive:
          anyOf:
          - type: string
          - type: 'null'
          title: From Archive
        message:
          type: string
          title: Message
      type: object
      required:
      - restored
      - message
      title: RestoreCategoryResponse
      description: Response for POST /content/categories/restore.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    VoiceResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        language:
          type: string
          title: Language
        type:
          type: string
          title: Type
        audio_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Url
      type: object
      required:
      - id
      - name
      - language
      - type
      title: VoiceResponse
      description: A single voice entry.

paths:

  # ─── Categories ─────────────────────────────────────────────────────
  /api/v1/content/categories:
    get:
      tags:
      - Categories
      summary: List all content categories
      description: Retrieve all content categories. By default returns only active categories.
        Use 'include_archived=true' to append archived entries to the response, or 'archived_only=true'
        to return only archived categories. Requires authentication.
      operationId: categories_list_api_v1_content_categories_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Archived
      - name: archived_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Archived Only
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Categories
      summary: Create a new content category
      description: Create a new content category. The category name must be unique and
        follow naming conventions. Active categories are returned by default; use 'include_archived=true'
        to include archived categories in the response or 'archived_only=true' to return
        only archived categories. Requires authentication.
      operationId: categories_create_api_v1_content_categories_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryBody'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/categories/restore:
    post:
      tags:
      - Categories
      summary: Restore a category from archive
      description: Restores a category from the archive directory.The category must
        exist in the archive with a .category extension.If a category with the same
        name already exists, it will be restored to its original state.
      operationId: categories_restore_api_v1_content_categories_restore_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreCategoryBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreCategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/content/categories/{category_name}:
    get:
      tags:
      - Categories
      summary: Get details of a specific content category
      description: Retrieve detailed information about a content category. Returns the
        category name, description, and associated metadata. Requires authentication.
      operationId: categories_details_api_v1_content_categories__category_name__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Categories
      summary: Update category name or description
      description: Update the name or description of a content category. The category
        must exist and be active to be updated. Requires authentication.
      operationId: categories_update_api_v1_content_categories__category_name__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Categories
      summary: Rename a content category
      description: Renames an existing content category. The new name must be unique
        and follow naming conventions. Requires authentication.
      operationId: categories_rename_api_v1_content_categories__category_name__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameCategoryBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenameCategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Categories
      summary: Remove a content category
      description: Delete a content category permanently. This operation cannot be undone
        and will remove the category and all associated content. Requires authentication.
      operationId: categories_remove_api_v1_content_categories__category_name__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveCategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  # ─── Categories Images ──────────────────────────────────────────────
  /api/v1/content/categories/{category_name}/images:
    get:
      tags:
      - Categories Images
      summary: List all images in a category
      description: Retrieve a list of all image files associated with a content category.
        Returns the image filenames and their metadata. Requires authentication.
      operationId: categories_images_list_api_v1_content_categories__category_name__images_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryImagesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Categories Images
      summary: Add an image to a category
      description: Add a new image file to the specified content category. This endpoint
        allows uploading image files and associating them with a category. The image
        file will be stored in the category's image directory. Requires authentication.
      operationId: categories_images_add_api_v1_content_categories__category_name__images_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/categories/{category_name}/images/{image_id}:
    put:
      tags:
      - Categories Images
      summary: Rename a category image
      description: Rename an image file associated with a category. The image must exist
        in the category and be accessible. Requires authentication.
      operationId: categories_images_update_api_v1_content_categories__category_name__images__image_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: image_id
        in: path
        required: true
        schema:
          type: string
          title: Image Id
      responses:
        '501':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Categories Images
      summary: Delete category image
      description: Delete or reset a category image.Removes the specified image from
        the given category.
      operationId: categories_images_delete_api_v1_content_categories__category_name__images__image_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: image_id
        in: path
        required: true
        schema:
          type: string
          title: Image Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  # ─── Categories Voices ──────────────────────────────────────────────
  /api/v1/content/categories/{category_name}/voices:
    get:
      tags:
      - Categories Voices
      summary: List voices for a category
      description: Retrieve a list of all voice files associated with a content category.
        Returns the voice filenames and their metadata. Requires authentication.
      operationId: categories_voices_list_api_v1_content_categories__category_name__voices_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryVoicesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Categories Voices
      summary: Add a voice to a category
      description: Add a new voice file to the specified content category. This endpoint
        allows uploading voice files and associating them with a category. The voice
        file will be stored in the category's voice directory. Requires authentication.
      operationId: categories_voices_add_api_v1_content_categories__category_name__voices_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/categories/{category_name}/voices/{voice_id}:
    put:
      tags:
      - Categories Voices
      summary: Replace audio for a category voice
      description: Upload or replace the audio file for a specific voice in a content
        category. This endpoint allows replacing the audio file associated with a voice.
        Requires authentication.
      operationId: categories_voices_update_api_v1_content_categories__category_name__voices__voice_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          title: Voice Id
      responses:
        '501':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Categories Voices
      summary: Delete a voice from a category
      description: Delete or reset a voice file associated with a content category.
        This operation removes the specified voice from the given category. Requires
        authentication.
      operationId: categories_voices_delete_api_v1_content_categories__category_name__voices__voice_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          title: Voice Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  # ─── Items ──────────────────────────────────────────────────────────
  /api/v1/content/categories/{category_name}/items:
    get:
      tags:
      - Items
      summary: List all items in a category
      description: Retrieve a list of all content items within a specific category.
        Returns the item names and their metadata. Requires authentication.
      operationId: items_list_api_v1_content_categories__category_name__items_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/categories/{category_name}/items/{item_id}:
    get:
      tags:
      - Items
      summary: Get a single item by ID
      description: Retrieve detailed information about a single content item. Returns
        the item name, associated images, and metadata. Requires authentication.
      operationId: items_get_api_v1_content_categories__category_name__items__item_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Items
      summary: Update an item in a category
      description: Update the name of a content item within a specific category. This
        endpoint allows modifying the item name for a given item ID. Requires authentication.
      operationId: items_update_api_v1_content_categories__category_name__items__item_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Items
      summary: Delete an item from a category
      description: Permanently delete a content item from its category. This operation
        cannot be undone and will remove the item and all associated metadata. Requires
        authentication.
      operationId: items_delete_api_v1_content_categories__category_name__items__item_id__delete
      security:
