openapi: 3.1.0
info:
  title: Content Management API
  version: 0.1.0
servers: []
components:
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /api/v1/login
  schemas:
    ArchivedEntry:
      properties:
        base_name:
          type: string
          title: Base Name
        archive_folder:
          type: string
          title: Archive Folder
        archived_at:
          type: integer
          title: Archived At
      type: object
      required:
      - base_name
      - archive_folder
      - archived_at
      title: ArchivedEntry
      description: Single archived category entry.
    Body_categories_images_add_api_v1_content_categories__category_name__images_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        name:
          type: string
          title: Name
      type: object
      required:
      - file
      - name
      title: Body_categories_images_add_api_v1_content_categories__category_name__images_post
    Body_categories_voices_upload_api_v1_content_categories__category_name__voices__voice_id__audio_put:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_categories_voices_upload_api_v1_content_categories__category_name__voices__voice_id__audio_put
    Body_create_item_endpoint_api_v1_content_items_post:
      properties:
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
        category:
          type: string
          title: Category
        item:
          type: string
          title: Item
      type: object
      required:
      - image
      - category
      - item
      title: Body_create_item_endpoint_api_v1_content_items_post
    Body_items_images_add_api_v1_content_categories__category_name__items__item_id__images_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_items_images_add_api_v1_content_categories__category_name__items__item_id__images_post
    Body_items_images_replace_api_v1_content_categories__category_name__items__item_id__images__image_index__put:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_items_images_replace_api_v1_content_categories__category_name__items__item_id__images__image_index__put
    Body_items_voices_upload_api_v1_content_categories__category_name__items__item_id__voices__voice_id__audio_put:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_items_voices_upload_api_v1_content_categories__category_name__items__item_id__voices__voice_id__audio_put
    CategoryDetailResponse:
      properties:
        name:
          type: string
          title: Name
        objects:
          items:
            type: string
          type: array
          title: Objects
          default: []
        images_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Images Names
      additionalProperties: true
      type: object
      required:
      - name
      title: CategoryDetailResponse
      description: 'Response for GET /content/categories/{name}.


        Language-specific CSV word lists are dynamic keys (images_en, images_fr, ...)

        so extra fields are allowed.'
    CategoryListResponse:
      properties:
        categories:
          items:
            type: string
          type: array
          title: Categories
        archived:
          anyOf:
          - items:
              $ref: '#/components/schemas/ArchivedEntry'
            type: array
          - type: 'null'
          title: Archived
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - categories
      title: CategoryListResponse
      description: Response for GET /content/categories.
    CreateCategoryBody:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: CreateCategoryBody
      description: Request body for creating a new category.
    CreateCategoryResponse:
      properties:
        category:
          type: string
          title: Category
        message:
          type: string
          title: Message
      type: object
      required:
      - category
      - message
      title: CreateCategoryResponse
      description: Response for POST /content/categories.
    CreateItemResponse:
      properties:
        category:
          type: string
          title: Category
        item:
          type: string
          title: Item
        folder:
          type: string
          title: Folder
        image_id:
          type: string
          title: Image Id
      type: object
      required:
      - category
      - item
      - folder
      - image_id
      title: CreateItemResponse
      description: Response for POST /content/items.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RemoveCategoryResponse:
      properties:
        archived:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Archived
        removed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Removed
        name:
          type: string
          title: Name
        archive_folder:
          anyOf:
          - type: string
          - type: 'null'
          title: Archive Folder
        destination:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination
        message:
          type: string
          title: Message
      type: object
      required:
      - name
      - message
      title: RemoveCategoryResponse
      description: 'Response for DELETE /content/categories/{name}.


        Maybe an archive result or a permanent delete result, so both

        "archived" and "removed" are optional.'
    RenameCategoryBody:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: RenameCategoryBody
      description: Request body for renaming a category.
    RenameCategoryResponse:
      properties:
        category:
          type: string
          title: Category
        message:
          type: string
          title: Message
      type: object
      required:
      - category
      - message
      title: RenameCategoryResponse
      description: Response for PATCH /content/categories/{name}.
    RestoreCategoryBody:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: RestoreCategoryBody
      description: Request body for restoring a category.
    RestoreCategoryResponse:
      properties:
        restored:
          type: boolean
          title: Restored
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        from_archive:
          anyOf:
          - type: string
          - type: 'null'
          title: From Archive
        message:
          type: string
          title: Message
      type: object
      required:
      - restored
      - message
      title: RestoreCategoryResponse
      description: Response for POST /content/categories/restore.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError

paths:

  # ─── Categories ─────────────────────────────────────────────────────
  /api/v1/content/categories:
    get:
      tags:
      - Categories
      summary: Categories List
      description: List categories.
      operationId: categories_list_api_v1_content_categories_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Archived
      - name: archived_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Archived Only
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Categories
      summary: Categories Create
      description: Create a new category.
      operationId: categories_create_api_v1_content_categories_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryBody'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/categories/restore:
    post:
      tags:
      - Categories
      summary: Categories Restore
      description: Restore a category from archive.
      operationId: categories_restore_api_v1_content_categories_restore_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreCategoryBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreCategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/content/categories/{category_name}:
    patch:
      tags:
      - Categories
      summary: Categories Rename
      description: Rename a category.
      operationId: categories_rename_api_v1_content_categories__category_name__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameCategoryBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenameCategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Categories
      summary: Categories Remove
      description: Remove a category.
      operationId: categories_remove_api_v1_content_categories__category_name__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveCategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Categories
      summary: Categories Details
      description: Get category details.
      operationId: categories_details_api_v1_content_categories__category_name__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Categories
      summary: Categories Update
      description: Update category name or description.
      operationId: categories_update_api_v1_content_categories__category_name__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  # ─── Categories Images ──────────────────────────────────────────────
  /api/v1/content/categories/{category_name}/images:
    get:
      tags:
      - Categories Images
      summary: Categories Images List
      description: List images for a category.
      operationId: categories_images_list_api_v1_content_categories__category_name__images_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Categories Images
      summary: Categories Images Add
      description: Add a new image to a category.
      operationId: categories_images_add_api_v1_content_categories__category_name__images_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_categories_images_add_api_v1_content_categories__category_name__images_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  # ─── Categories Voices ──────────────────────────────────────────────
  /api/v1/content/categories/{category_name}/voices:
    get:
      tags:
      - Categories Voices
      summary: Categories Voices List
      description: List voices for a category.
      operationId: categories_voices_list_api_v1_content_categories__category_name__voices_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/categories/{category_name}/voices/{voice_id}:
    put:
      tags:
      - Categories Voices
      summary: Categories Voices Update
      description: Rename a category voice.
      operationId: categories_voices_update_api_v1_content_categories__category_name__voices__voice_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          title: Voice Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Categories Voices
      summary: Categories Voices Delete
      description: Delete or reset a category voice.
      operationId: categories_voices_delete_api_v1_content_categories__category_name__voices__voice_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          title: Voice Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/categories/{category_name}/voices/{voice_id}/audio:
    put:
      tags:
      - Categories Voices
      summary: Categories Voices Upload
      description: Upload or replace audio for a category voice.
      operationId: categories_voices_upload_api_v1_content_categories__category_name__voices__voice_id__audio_put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          title: Voice Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_categories_voices_upload_api_v1_content_categories__category_name__voices__voice_id__audio_put'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  # ─── Items ──────────────────────────────────────────────────────────
  /api/v1/content/categories/{category_name}/items/{item_id}:
    put:
      tags:
      - Items
      summary: Items Update
      description: Update item name.
      operationId: items_update_api_v1_content_categories__category_name__items__item_id__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Items
      summary: Items Delete
      description: Delete an item from a category.
      operationId: items_delete_api_v1_content_categories__category_name__items__item_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Items
      summary: Items Get
      description: Get a single item by ID.
      operationId: items_get_api_v1_content_categories__category_name__items__item_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  # ─── Items Images ───────────────────────────────────────────────────
  /api/v1/content/categories/{category_name}/items/{item_id}/files/{file_index}:
    delete:
      tags:
      - Items Images
      summary: Items Images Delete
      description: Delete a file variant (at least one must remain).
      operationId: items_images_delete_api_v1_content_categories__category_name__items__item_id__files__file_index__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      - name: file_index
        in: path
        required: true
        schema:
          type: integer
          title: File Index
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/categories/{category_name}/items/{item_id}/images:
    get:
      tags:
      - Items Images
      summary: Items Images List
      description: List image file variants for an item.
      operationId: items_images_list_api_v1_content_categories__category_name__items__item_id__images_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Items Images
      summary: Items Images Add
      description: Upload an additional file variant for an image.
      operationId: items_images_add_api_v1_content_categories__category_name__items__item_id__images_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_items_images_add_api_v1_content_categories__category_name__items__item_id__images_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/categories/{category_name}/items/{item_id}/images/{image_index}:
    put:
      tags:
      - Items Images
      summary: Items Images Replace
      description: Replace a specific file variant.
      operationId: items_images_replace_api_v1_content_categories__category_name__items__item_id__images__image_index__put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      - name: image_index
        in: path
        required: true
        schema:
          type: integer
          title: Image Index
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_items_images_replace_api_v1_content_categories__category_name__items__item_id__images__image_index__put'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  # ─── Items Voices ───────────────────────────────────────────────────
  /api/v1/content/categories/{category_name}/items/{item_id}/voices:
    get:
      tags:
      - Items Voices
      summary: Items Voices List
      description: List voices for an image.
      operationId: items_voices_list_api_v1_content_categories__category_name__items__item_id__voices_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      - name: item_id
        in: path
        required: true
