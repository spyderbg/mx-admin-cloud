openapi: 3.1.0
info:
  title: Logging Internal API
  version: 0.1.0
servers: []
paths:
  /internal/loggers:
    get:
      tags:
      - internal-logging
      summary: List logging service providers
      description: Return the logging service providers that the emit endpoint routes
        through. By default only enabled providers are returned. Pass 'all=true' to
        include every configured provider regardless of state.
      operationId: list_loggers_internal_loggers_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: all_loggers
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: All Loggers
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceProviderInfo'
                title: Response List Loggers Internal Loggers Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/logging/emit:
    post:
      tags:
      - internal-logging
      summary: Emit a structured log message
      description: Post a structured log message to the named logger. The ``logger_name``
        selects the target channel; ``level`` and ``event`` mirror structlog semantics.
      operationId: emit_log_internal_logging_emit_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogEmitRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/logging/api-request:
    post:
      tags:
      - internal-logging
      summary: Emit an API request log message
      description: Post a structured log message to the 'requests' logger. ``level``
        and ``event`` mirror structlog semantics.
      operationId: emit_api_request_log_internal_logging_api_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/logging/provider-request:
    post:
      tags:
      - internal-logging
      summary: Log a TTS/STT provider request
      description: Record a provider request (model, actor, latency, …) through the
        request-logger channel.
      operationId: log_provider_request_internal_logging_provider_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogProviderRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
components:
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /api/v1/login
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LogEmitRequest:
      properties:
        level:
          $ref: '#/components/schemas/LogLevel'
          description: Log level, defaults to 'info'
          default: info
        event:
          type: string
          title: Event
          description: Log event name
        fields:
          additionalProperties: true
          type: object
          title: Fields
        logger_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Logger Name
          description: Logger name; omit to use the default logger
      type: object
      required:
      - event
      title: LogEmitRequest
      description: Body for "POST /internal/logging/emit".
    LogLevel:
      type: string
      enum:
      - trace
      - debug
      - info
      - warning
      - error
      - critical
      - fatal
      title: LogLevel
    LogProviderRequest:
      properties:
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        voice_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice Id
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        input:
          anyOf:
          - {}
          - type: 'null'
          title: Input
        response_duration:
          anyOf:
          - type: number
          - type: 'null'
          title: Response Duration
      type: object
      title: LogProviderRequest
      description: Body for "POST /internal/logging/provider-request".
    LogRequest:
      properties:
        level:
          $ref: '#/components/schemas/LogLevel'
          description: Log level, defaults to 'info'
          default: info
        event:
          type: string
          title: Event
          description: Log event name
        fields:
          additionalProperties: true
          type: object
          title: Fields
      type: object
      required:
      - event
      title: LogRequest
      description: Base body for "POST /internal/logging/emit" and "POST /internal/logging/api-request".
    ServiceProviderInfo:
      properties:
        name:
          type: string
          title: Name
          description: Human-readable name
        service:
          type: string
          title: Service
          description: Service name
        provider:
          type: string
          title: Provider
          description: Provider name
        enabled:
          type: boolean
          title: Enabled
          description: Whether the provider is enabled
        priority:
          type: integer
          title: Priority
          description: Priority of the provider
      type: object
      required:
      - name
      - service
      - provider
      - enabled
      - priority
      title: ServiceProviderInfo
      description: Metadata for one configured service provider.
    StatusResponse:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: StatusResponse
      description: Generic acknowledgement returned by fire-and-forget logging endpoints.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
