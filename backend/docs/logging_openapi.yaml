openapi: 3.1.0
info:
  title: Logging Internal API
  version: 0.1.0
servers: []
paths:
  /internal/loggers/:
    get:
      tags:
      - internal-loggers
      summary: List logging service providers
      description: Return the logging service providers that the emit endpoint routes
        through. By default only enabled providers are returned. Pass 'all=true' to
        include every configured provider regardless of state.
      operationId: list_loggers_internal_loggers__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: all_loggers
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: All Loggers
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceProviderInfo'
                title: Response List Loggers Internal Loggers  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/loggers/emit:
    post:
      tags:
      - internal-loggers
      summary: Emit a structured log message
      description: Post a structured log message to the named logger. The ``logger_name``
        selects the target channel; ``level`` and ``event`` mirror structlog semantics.
      operationId: emit_log_internal_loggers_emit_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/loggers/{logger_name}/log:
    post:
      tags:
      - internal-loggers
      summary: Emit a log message to a specific logger
      description: Post a structured log message to the logger specified by path parameter.
        ``level`` and ``event`` mirror structlog semantics.
      operationId: emit_log_by_name_internal_loggers__logger_name__log_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: logger_name
        in: path
        required: true
        schema:
          type: string
          title: Logger Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/loggers/logging/log/api-request:
    post:
      tags:
      - internal-loggers
      summary: Emit an API request log message
      description: Post a structured log message to the 'requests' logger. ``level``
        and ``event`` mirror structlog semantics.
      operationId: emit_api_request_log_internal_loggers_logging_log_api_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogApiRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/loggers/logging/log/service:
    post:
      tags:
      - internal-loggers
      summary: Emit a service log message
      description: Post a structured log message to the 'service' logger. ``level``
        and ``event`` mirror structlog semantics.
      operationId: emit_service_log_internal_loggers_logging_log_service_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogServiceRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/loggers/logging/log/provider:
    post:
      tags:
      - internal-loggers
      summary: Log a TTS/STT provider request
      description: Record a provider request (model, actor, latency, …) through the
        request-logger channel.
      operationId: log_provider_request_internal_loggers_logging_log_provider_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogProviderRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/loggers/logging/log/payment:
    post:
      tags:
      - internal-loggers
      summary: Emit a payment log message
      description: Post a structured log message to the 'payment' logger. ``level``
        and ``event`` mirror structlog semantics.
      operationId: emit_payment_log_internal_loggers_logging_log_payment_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
components:
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /api/v1/login
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LogApiRequest:
      properties:
        level:
          $ref: '#/components/schemas/LogLevel'
          description: Log level, defaults to 'info'
          default: info
        event:
          type: string
          title: Event
          description: Log event
        fields:
          additionalProperties: true
          type: object
          title: Fields
        api_path:
          type: string
          title: Api Path
          description: HTTP path
        api_method:
          type: string
          title: Api Method
          description: HTTP method
        api_status:
          type: integer
          title: Api Status
          description: HTTP status code
        api_duration:
          type: number
          title: Api Duration
          description: Request duration in seconds
      type: object
      required:
      - event
      - api_path
      - api_method
      - api_status
      - api_duration
      title: LogApiRequest
      description: Body for "POST /internal/loggers/logging/log/api-request".
    LogLevel:
      type: string
      enum:
      - trace
      - debug
      - info
      - warning
      - error
      - critical
      - fatal
      title: LogLevel
    LogProviderRequest:
      properties:
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        actor:
          anyOf:
          - type: string
          - type: 'null'
          title: Actor
        voice_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice Id
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        input:
          anyOf:
          - {}
          - type: 'null'
          title: Input
        response_duration:
          anyOf:
          - type: number
          - type: 'null'
          title: Response Duration
      type: object
      title: LogProviderRequest
      description: Body for "POST /internal/loggers/log/provider".
    LogRequest:
      properties:
        level:
          $ref: '#/components/schemas/LogLevel'
          description: Log level, defaults to 'info'
          default: info
        event:
          type: string
          title: Event
          description: Log event
        fields:
          additionalProperties: true
          type: object
          title: Fields
      type: object
      required:
      - event
      title: LogRequest
      description: Base body for "POST /internal/loggers/emit" and "POST /internal/loggers/log/api-request".
    LogServiceRequest:
      properties:
        level:
          $ref: '#/components/schemas/LogLevel'
          description: Log level, defaults to 'info'
          default: info
        event:
          type: string
          title: Event
          description: Log event
        fields:
          additionalProperties: true
          type: object
          title: Fields
        service:
          type: string
          title: Service
          description: Service name
      type: object
      required:
      - event
      - service
      title: LogServiceRequest
      description: Body for "POST /internal/loggers/log/service".
    ServiceProviderInfo:
      properties:
        name:
          type: string
          title: Name
          description: Human-readable name
        service:
          type: string
          title: Service
          description: Service name
        provider:
          type: string
          title: Provider
          description: Provider name
        provider_category:
          type: string
          title: Provider Category
          description: Category of the provider
          default: normal
        enabled:
          type: boolean
          title: Enabled
          description: Whether the provider is enabled
        priority:
          type: integer
          title: Priority
          description: Priority of the provider
      type: object
      required:
      - name
      - service
      - provider
      - enabled
      - priority
      title: ServiceProviderInfo
      description: Metadata for one configured service provider.
    StatusResponse:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: StatusResponse
      description: Generic acknowledgement returned by fire-and-forget logging endpoints.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
