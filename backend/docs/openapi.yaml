openapi: 3.1.0
info:
  title: FastAPI Backend
  version: 0.1.0
paths:
  /api/v1/login:
    post:
      tags:
      - auth
      summary: Login
      description: 'Login for web interface: returns a long-lived JWT.'
      operationId: login_api_v1_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_api_v1_login_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cli-login:
    post:
      tags:
      - auth
      summary: Cli Login
      description: 'Login for CLI only: allowed only over the Unix domain socket.
        Returns a short-lived JWT.'
      operationId: cli_login_api_v1_cli_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_cli_login_api_v1_cli_login_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ping:
    get:
      tags:
      - tasks
      summary: Get Ping
      description: Ping the server.
      operationId: get_ping_api_v1_ping_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/status:
    get:
      tags:
      - tasks
      summary: Get Status
      description: Get the server status.
      operationId: get_status_api_v1_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/v1/operation:
    post:
      tags:
      - tasks
      summary: Post Operation
      description: Perform an operation.
      operationId: post_operation_api_v1_operation_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/list-files:
    post:
      tags:
      - tasks
      summary: Post List Files
      description: List files in the configured content directory.
      operationId: post_list_files_api_v1_list_files_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListFilesRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/content/categories:
    get:
      tags:
      - content
      summary: List Categories
      description: List categories.
      operationId: list_categories_api_v1_content_categories_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Archived
      - name: archived_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Archived Only
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - content
      summary: Create Category Endpoint
      description: Create a new category.
      operationId: create_category_endpoint_api_v1_content_categories_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryBody'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/categories/restore:
    post:
      tags:
      - content
      summary: Restore Category Endpoint
      description: Restore a category.
      operationId: restore_category_endpoint_api_v1_content_categories_restore_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreCategoryBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/content/categories/{category_name}:
    patch:
      tags:
      - content
      summary: Rename Category Endpoint
      description: Rename a category.
      operationId: rename_category_endpoint_api_v1_content_categories__category_name__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameCategoryBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - content
      summary: Remove Category
      description: Remove a category.
      operationId: remove_category_api_v1_content_categories__category_name__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - content
      summary: Category Details
      description: Get category details.
      operationId: category_details_api_v1_content_categories__category_name__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/items:
    post:
      tags:
      - content
      summary: Create Item Endpoint
      description: Create a new content item (image + voices).
      operationId: create_item_endpoint_api_v1_content_items_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_item_endpoint_api_v1_content_items_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/users:
    post:
      tags:
      - users
      summary: Create User
      description: Create a new user.
      operationId: create_user_api_v1_users_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - users
      summary: List Users
      description: List all users with optional filtering.
      operationId: list_users_api_v1_users_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: username
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
      - name: role
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserOut'
                title: Response List Users Api V1 Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{username}:
    delete:
      tags:
      - users
      summary: Delete User
      description: Delete a user.
      operationId: delete_user_api_v1_users__username__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{username}/password:
    patch:
      tags:
      - users
      summary: Change Password
      description: Change a user's password.
      operationId: change_password_api_v1_users__username__password_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/{username}/role:
    patch:
      tags:
      - users
      summary: Change Role
      description: Change a user's role.
      operationId: change_role_api_v1_users__username__role_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/generate:
    post:
      tags:
      - internal-jobs
      summary: Start async TTS pipeline job
      description: Upload an input file (TXT, CSV, or XLSX) and start a TTS pipeline
        job in the background. Returns a ``job_id`` that can be polled via the status
        endpoint.
      operationId: generate_internal_generate_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_generate_internal_generate_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateJobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/generate/{job_id}/status:
    get:
      tags:
      - internal-jobs
      summary: Poll TTS pipeline job status
      description: 'Return the current status of a TTS pipeline job. Status values:
        ``pending``, ``running``, ``completed``, ``failed``.'
      operationId: generate_status_internal_generate__job_id__status_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/services:
    get:
      tags:
      - internal-services
      summary: List all configured service providers
      description: Aggregate translators, generators, optimizers, and evaluators into
        one response. Each entry is tagged with its category so the caller needs only
        one request.
      operationId: list_all_services_internal_services_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ServiceProviderInfo'
                type: array
                title: Response List All Services Internal Services Get
      security:
      - OAuth2PasswordBearer: []
  /internal/loggers/:
    get:
      tags:
      - internal-loggers
      summary: List logging service providers
      description: Return the logging service providers that the emit endpoint routes
        through. By default only enabled providers are returned. Pass 'all=true' to
        include every configured provider regardless of state.
      operationId: list_loggers_internal_loggers__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: all_loggers
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: All Loggers
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceProviderInfo'
                title: Response List Loggers Internal Loggers  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/loggers/reset:
    post:
      tags:
      - internal-loggers
      summary: Reset active logger providers
      description: Trigger reset on all active logging providers. For file-backed
        providers this truncates active log files.
      operationId: reset_loggers_internal_loggers_reset_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetLogsResponse'
      security:
      - OAuth2PasswordBearer: []
  /internal/loggers/emit:
    post:
      tags:
      - internal-loggers
      summary: Emit a structured log message
      description: Post a structured log message to the named logger. The ``logger_name``
        selects the target channel; ``level`` and ``event`` mirror structlog semantics.
      operationId: emit_log_internal_loggers_emit_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/loggers/{logger_name}/log:
    post:
      tags:
      - internal-loggers
      summary: Emit a log message to a specific logger
      description: Post a structured log message to the logger specified by path parameter.
        ``level`` and ``event`` mirror structlog semantics.
      operationId: log_by_logger_name_internal_loggers__logger_name__log_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: logger_name
        in: path
        required: true
        schema:
          type: string
          title: Logger Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/loggers/logging/log/api-request:
    post:
      tags:
      - internal-loggers
      summary: Emit an API request log message
      description: Post a structured log message to the 'requests' logger. ``level``
        and ``event`` mirror structlog semantics.
      operationId: log_api_request_internal_loggers_logging_log_api_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogApiRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/loggers/logging/log/service:
    post:
      tags:
      - internal-loggers
      summary: Emit a service log message
      description: Post a structured log message to the 'service' logger. ``level``
        and ``event`` mirror structlog semantics.
      operationId: log_service_request_internal_loggers_logging_log_service_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogServiceRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/loggers/logging/log/provider:
    post:
      tags:
      - internal-loggers
      summary: Log a TTS/STT provider request
      description: Record a provider request (model, actor, latency, …) through the
        request-logger channel.
      operationId: log_provider_request_internal_loggers_logging_log_provider_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogProviderRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/loggers/logging/log/payment:
    post:
      tags:
      - internal-loggers
      summary: Emit a payment log message
      description: Post a structured log message to the 'payment' logger. ``level``
        and ``event`` mirror structlog semantics.
      operationId: log_payment_request_internal_loggers_logging_log_payment_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/configurations/apply:
    post:
      tags:
      - internal-configuration
      summary: Apply Config Payload
      description: Validate and apply one service config payload in memory.
      operationId: apply_config_payload_internal_configurations_apply_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyConfigurationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyConfigurationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/configurations/upload:
    post:
      tags:
      - internal-configuration
      summary: Upload Config File
      description: Validate and apply uploaded config content in memory without persisting.
      operationId: upload_config_file_internal_configurations_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_config_file_internal_configurations_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyConfigurationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /internal/configurations/{service_name}:
    get:
      tags:
      - internal-configuration
      summary: List Service Configs
      description: List JSON config files for one service.
      operationId: list_service_configs_internal_configurations__service_name__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: service_name
        in: path
        required: true
        schema:
          type: string
          title: Service Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConfigurationFileSummaryResponse'
                title: Response List Service Configs Internal Configurations  Service
                  Name  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - internal-configuration
      summary: Add Service Config
      description: Create a new JSON config file for one service.
      operationId: add_service_config_internal_configurations__service_name__post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: service_name
        in: path
        required: true
        schema:
          type: string
          title: Service Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddConfigurationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationMutationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/configurations/{service_name}/{config_name}:
    delete:
      tags:
      - internal-configuration
      summary: Remove Service Config
      description: Remove one JSON config file for one service.
      operationId: remove_service_config_internal_configurations__service_name___config_name__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: service_name
        in: path
        required: true
        schema:
          type: string
          title: Service Name
      - name: config_name
        in: path
        required: true
        schema:
          type: string
          title: Config Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationMutationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - internal-configuration
      summary: Patch Service Config
      description: Merge-patch one JSON config file for one service.
      operationId: patch_service_config_internal_configurations__service_name___config_name__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: service_name
        in: path
        required: true
        schema:
          type: string
          title: Service Name
      - name: config_name
        in: path
        required: true
        schema:
