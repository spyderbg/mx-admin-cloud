openapi: 3.1.0
info:
  title: Content Management API
  version: 0.1.0
servers: []
paths:
  /api/v1/content/categories:
    get:
      tags:
      - content
      summary: List Categories
      description: List categories.
      operationId: list_categories_api_v1_content_categories_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Archived
      - name: archived_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Archived Only
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - content
      summary: Create Category Endpoint
      description: Create a new category.
      operationId: create_category_endpoint_api_v1_content_categories_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryBody'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/categories/restore:
    post:
      tags:
      - content
      summary: Restore Category Endpoint
      description: Restore a category from archive.
      operationId: restore_category_endpoint_api_v1_content_categories_restore_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreCategoryBody'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreCategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/content/categories/{category_name}:
    patch:
      tags:
      - content
      summary: Rename Category Endpoint
      description: Rename a category.
      operationId: rename_category_endpoint_api_v1_content_categories__category_name__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameCategoryBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenameCategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - content
      summary: Remove Category
      description: Remove a category.
      operationId: remove_category_api_v1_content_categories__category_name__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveCategoryResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - content
      summary: Category Details
      description: Get category details.
      operationId: category_details_api_v1_content_categories__category_name__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: category_name
        in: path
        required: true
        schema:
          type: string
          title: Category Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/content/items:
    post:
      tags:
      - content
      summary: Create Item Endpoint
      description: Create a new content item (image + voices).
      operationId: create_item_endpoint_api_v1_content_items_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_item_endpoint_api_v1_content_items_post'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateItemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
components:
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: /api/v1/login
  schemas:
    ArchivedEntry:
      properties:
        base_name:
          type: string
          title: Base Name
        archive_folder:
          type: string
          title: Archive Folder
        archived_at:
          type: integer
          title: Archived At
      type: object
      required:
      - base_name
      - archive_folder
      - archived_at
      title: ArchivedEntry
      description: Single archived category entry.
    Body_create_item_endpoint_api_v1_content_items_post:
      properties:
        image:
          type: string
          contentMediaType: application/octet-stream
          title: Image
        category:
          type: string
          title: Category
        item:
          type: string
          title: Item
      type: object
      required:
      - image
      - category
      - item
      title: Body_create_item_endpoint_api_v1_content_items_post
    CategoryDetailResponse:
      properties:
        name:
          type: string
          title: Name
        objects:
          items:
            type: string
          type: array
          title: Objects
          default: []
        images_names:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Images Names
      additionalProperties: true
      type: object
      required:
      - name
      title: CategoryDetailResponse
      description: 'Response for GET /content/categories/{name}.


        Language-specific CSV word lists are dynamic keys (images_en, images_fr, ...)

        so extra fields are allowed.'
    CategoryListResponse:
      properties:
        categories:
          items:
            type: string
          type: array
          title: Categories
        archived:
          anyOf:
          - items:
              $ref: '#/components/schemas/ArchivedEntry'
            type: array
          - type: 'null'
          title: Archived
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      type: object
      required:
      - categories
      title: CategoryListResponse
      description: Response for GET /content/categories.
    CreateCategoryBody:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: CreateCategoryBody
      description: Request body for creating a new category.
    CreateCategoryResponse:
      properties:
        category:
          type: string
          title: Category
        message:
          type: string
          title: Message
      type: object
      required:
      - category
      - message
      title: CreateCategoryResponse
      description: Response for POST /content/categories.
    CreateItemResponse:
      properties:
        category:
          type: string
          title: Category
        item:
          type: string
          title: Item
        folder:
          type: string
          title: Folder
        image_id:
          type: string
          title: Image Id
      type: object
      required:
      - category
      - item
      - folder
      - image_id
      title: CreateItemResponse
      description: Response for POST /content/items.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RemoveCategoryResponse:
      properties:
        archived:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Archived
        removed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Removed
        name:
          type: string
          title: Name
        archive_folder:
          anyOf:
          - type: string
          - type: 'null'
          title: Archive Folder
        destination:
          anyOf:
          - type: string
          - type: 'null'
          title: Destination
        message:
          type: string
          title: Message
      type: object
      required:
      - name
      - message
      title: RemoveCategoryResponse
      description: 'Response for DELETE /content/categories/{name}.


        May be an archive result or a permanent delete result, so both

        ``archived`` and ``removed`` are optional.'
    RenameCategoryBody:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: RenameCategoryBody
      description: Request body for renaming a category.
    RenameCategoryResponse:
      properties:
        category:
          type: string
          title: Category
        message:
          type: string
          title: Message
      type: object
      required:
      - category
      - message
      title: RenameCategoryResponse
      description: Response for PATCH /content/categories/{name}.
    RestoreCategoryBody:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: RestoreCategoryBody
      description: Request body for restoring a category.
    RestoreCategoryResponse:
      properties:
        restored:
          type: boolean
          title: Restored
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        from_archive:
          anyOf:
          - type: string
          - type: 'null'
          title: From Archive
        message:
          type: string
          title: Message
      type: object
      required:
      - restored
      - message
      title: RestoreCategoryResponse
      description: Response for POST /content/categories/restore.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
