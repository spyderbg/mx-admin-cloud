What was built                                                    
                                                                    
  - GitHub adapter (github_api.py): calls GitHub through the        
    existing gh login, so no token is ever read or printed. It      
    handles retries, rate limits, pacing and pagination, and        
    validates every response.                                       
  - Synchronizer (issue_sync.py): local state stays the authority   
    and the Issues are derived from it.                             
    - Each Issue carries a versioned ownership marker. Before any   
      write, the coordinator checks the marker, that its own account
      created the Issue, and the exact Issue number and ID.         
    - Network calls never happen while a coordinator lock is held.  
    - The only way GitHub can change local state is a /feature hold 
      or /feature release comment from an authorized operator.      
  - Dependency lifecycle: one Backend task is created or reused per 
    API; only the consumers wait; only verified evidence unblocks   
    them; a re-opened contract blocks them again; a human hold stays
    until it is explicitly released.                                
  - Commands: a feature.py github … group (status, labels, sync,    
    reconcile, inspect, owned, deps, test-lifecycle, cleanup-test)  
    plus hold and release. Everything is a dry run unless --apply.  
  - Two fixes to existing behavior: re-opening a dependency now also
    blocks dependents that were only ready, not just verified ones. 
    A task can no longer be verified while one of its dependencies  
    is unverified.                    

